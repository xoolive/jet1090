name: Rust

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Linux dependencies
        run: |
          sudo apt update
          sudo apt-get install -y --no-install-recommends libiio-dev libsoapysdr-dev protobuf-compiler

      - name: Code linting
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Code formatting
        run: cargo fmt --all --check

      - name: Build
        run: cargo build --verbose --release --all-features

      - name: Run tests, examples and benchmarks
        run: cargo test --workspace --all-features --all-targets

      - name: Test finite IQ CLI with isolated fixtures
        env:
          JET1090_TEST_BINARY: ${{ github.workspace }}/target/release/jet1090
        run: cargo test --locked -p jet1090 --all-features cli_iq_ -- --ignored

      - name: Check docs
        env:
          RUSTDOCFLAGS: "-D rustdoc::all -A rustdoc::private-doc-tests"
        run: cargo doc --all-features --no-deps
