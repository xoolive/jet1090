[package]
name = "jet1090"
description = "A real-time comprehensive Mode S and ADS-B data decoder"
repository = "https://github.com/xoolive/jet1090"
keywords = ["aircraft", "ADS-B", "Mode-S", "decoding"]
readme = "readme.md"
authors.workspace = true
version.workspace = true
license.workspace = true
edition.workspace = true
homepage.workspace = true

[features]
default = ['rtlsdr', 'airspy', 'hackrf', 'sero', 'ssh']
sdr = ['rs1090/sdr', 'dep:desperado']
airspy = ['sdr', 'rs1090/airspy']
hackrf = ['sdr', 'rs1090/hackrf']
rtlsdr = ['sdr', 'rs1090/rtlsdr']
soapy = ['sdr', 'rs1090/soapy']
sero = ['rs1090/sero']
ssh = ['rs1090/ssh']

[dependencies]
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["color", "derive", "wrap_help", "env"] }
clap_complete = "4.6.3"
clap_complete_nushell = "4.5.10"
crossterm = { version = "0.29.0", features = ["event-stream"] }
deku = "0.20.3"
desperado = { version = "0.4.1", optional = true }
dirs = "6.0.0"
dotenv = "0.15.0"
futures = "0.3.31"
futures-util = "0.3.32"
hex = "0.4.3"
keepawake = "0.5.1"
ratatui = "0.30.0"
redis = { version = "1.0.4", features = ["tokio-comp"] }
regex = "1.12.2"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rs1090 = { version = "0.5.2", path = "../rs1090", features = ["aircraft", "sdr"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
soapysdr = { version = "0.5.0", optional = true }
tokio = { version = "1.52.1", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
url = "2.5.7"
warp = "0.3.6"

[[bin]]
name = "jet1090"
path = "src/main.rs"
